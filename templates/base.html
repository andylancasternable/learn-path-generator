<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Learn Path Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">📚</span>
      <span class="sidebar-title">LearnPath</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">🏠</span> Dashboard
      </a></li>
      <li><a href="{{ url_for('subjects') }}" class="{% if request.endpoint == 'subjects' %}active{% endif %}">
        <span class="nav-icon">📂</span> Subjects
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <span class="sidebar-version">v1.0</span>
    </div>
  </nav>

  <main class="main-content">
    <div class="content-wrapper">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
